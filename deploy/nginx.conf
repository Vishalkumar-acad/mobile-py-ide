# Mobile Py IDE — example Nginx reverse proxy.
# Put this in /etc/nginx/sites-available/mobile-py-ide and symlink into
# sites-enabled. Replace the server_name with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name ide.example.com;

    # Redirect to HTTPS (Cloudflare Tunnel terminates TLS in front of us,
    # in which case you can keep only the proxy_pass block below).
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep Server-Sent Events (live console output) flowing.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # give the runner room for its own timeout plus overhead
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
